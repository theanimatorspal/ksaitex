<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vim LaTeX Block Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <link rel="stylesheet" href="css/vimstyle.css">
</head>
<body>
  <main id="paper-container"></main>
  <div id="status-bar">
    <div class="status-left">
      <span id="mode-badge" class="mode-badge mode-badge-normal">-- NORMAL --</span>
      <div class="command-input-container">
        <span id="command-prefix" class="command-prefix-text">:</span>
        <input type="text" id="command-input" readonly placeholder="" />
      </div>
    </div>
    <div class="status-right">
      <span id="status-info">Block 1/1</span>
      <button id="export-btn">Export .tex</button>
    </div>
  </div>

  <div id="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span>Exported LaTeX Source</span>
        <button id="modal-close" class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <textarea id="latex-output" readonly></textarea>
      </div>
      <div class="modal-footer">
        <button id="copy-tex-btn">Copy</button>
        <button id="download-tex-btn" class="btn-primary">Download .tex</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/modules/vim.js"></script>
</body>
</html>
